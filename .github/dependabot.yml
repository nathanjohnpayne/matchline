version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Every other minor and patch update shares one PR. Majors open as
      # individual PRs (mergepath#1802).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      typescript-toolchain:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      vite-toolchain:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "vite-plugin-pwa"
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      firebase-sdk:
        patterns:
          - "firebase"
          - "@firebase/*"
      # Every other minor and patch update shares one PR. Majors open as
      # individual PRs (mergepath#1802).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    # eslint / @eslint/js majors pinned out until eslint-plugin-react supports
    # eslint 10 (its peer caps at <=9.7, so eslint 10 fails npm ERESOLVE). Both
    # are pinned together: @eslint/js is a direct devDependency consumed by
    # eslint.config.js (js.configs.recommended) and tracks eslint's major, so
    # ignoring only eslint would let the group pair @eslint/js 10 with eslint 9
    # and reopen a lint-breaking PR. Remove both ignores when eslint-plugin-react
    # ships a release whose eslint peer allows 10.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript majors pinned out until typescript-eslint supports TypeScript 7.
      # Every published typescript-eslint, through the current latest (8.65.0),
      # caps its typescript peer at ">=4.8.4 <6.1.0" — TypeScript 7 is the native
      # Go port and no compatible release exists yet, so a group bump to 7.x fails
      # npm ci with ERESOLVE. typescript-eslint is a direct devDependency consumed
      # by eslint.config.js, so it cannot be dropped to take the bump instead.
      # Remove this ignore when typescript-eslint ships a release whose typescript
      # peer allows 7. Hit on #378, which had to hold typescript at ~6.0.3.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
