version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    commit-message:
      prefix: "deps"
    # eslint / @eslint/js majors pinned out until eslint-plugin-react supports
    # eslint 10 (its peer caps at <=9.7, so eslint 10 fails npm ERESOLVE). Both
    # are pinned together: @eslint/js is a direct devDependency consumed by
    # eslint.config.js (js.configs.recommended) and tracks eslint's major, so
    # ignoring only eslint would let the group pair @eslint/js 10 with eslint 9
    # and reopen a lint-breaking PR. Remove both ignores when eslint-plugin-react
    # ships a release whose eslint peer allows 10.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
