name: test

# Runs the full test surface — unit tests, build, and the
# emulator-backed rules + integration tests. The rules suite
# includes `tests/rejected-exclusion.integration.test.ts` which
# pins the project's zero-fabrication invariant; that test was
# not enforced in CI before this workflow shipped (caught by
# nathanpayne-codex Phase 4b on #93).

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit:
    name: unit + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v6.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: npm --prefix functions ci

      - name: Unit tests (default vitest run)
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build functions
        run: npm --prefix functions run build

  rules:
    name: rules + integration (emulator)
    runs-on: ubuntu-latest
    # Emulator-backed tests are slower than unit tests; isolate
    # the failure scope so a flaky emulator boot doesn't mask
    # real unit-test signal.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v6.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java 21 (Firestore emulator dependency)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: npm --prefix functions ci

      - name: Rules + integration tests (Firestore emulator)
        # `test:rules` runs:
        #   - tests/firestore-rules.test.ts (per-collection
        #     owner_uid invariant from #60)
        #   - tests/**/*.integration.test.ts including the
        #     rejected-exclusion test from #82 — the
        #     zero-fabrication invariant pinned end-to-end on
        #     real Firestore semantics.
        run: npm run test:rules
