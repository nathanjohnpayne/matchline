name: test

# Runs the full test surface — unit tests, build, and the
# emulator-backed rules + integration tests. The rules suite
# includes `tests/rejected-exclusion.integration.test.ts` which
# pins the project's zero-fabrication invariant; that test was
# not enforced in CI before this workflow shipped (caught by
# nathanpayne-codex Phase 4b on #93).

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit:
    name: unit + build (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matrix mirrors package.json engines.node: ^20.19.0 || >=22.12.0.
        # Validates that the bumped vite v8 / vitest v4 toolchain works
        # on both the lowest-supported 20.x and the lowest-supported 22.x.
        # Added in response to CodeRabbit finding on #162.
        node-version: ['20.19.0', '22.12.0']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: npm --prefix functions ci

      - name: Unit tests (default vitest run)
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build functions
        run: npm --prefix functions run build

  rules:
    name: rules + integration (emulator, node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # Emulator-backed tests are slower than unit tests; isolate
    # the failure scope so a flaky emulator boot doesn't mask
    # real unit-test signal.
    strategy:
      fail-fast: false
      matrix:
        # Same matrix as the unit job — validates rules-unit-testing v5
        # + firebase v12 stack on both supported Node ranges.
        node-version: ['20.19.0', '22.12.0']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java 21 (Firestore emulator dependency)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: npm --prefix functions ci

      - name: Rules + integration tests (Firestore emulator)
        # `test:rules` runs:
        #   - tests/firestore-rules.test.ts (per-collection
        #     owner_uid invariant from #60)
        #   - tests/**/*.integration.test.ts including the
        #     rejected-exclusion test from #82 — the
        #     zero-fabrication invariant pinned end-to-end on
        #     real Firestore semantics.
        run: npm run test:rules
